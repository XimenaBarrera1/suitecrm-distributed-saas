# ------------------------------------------------
# SERVIDOR POR DEFECTO (Health Checks)
# ------------------------------------------------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /proxy-health {
        default_type text/plain;
        return 200 "DEFAULT OK\n";
    }
}

# ------------------------------------------------
# CLIENTE A
# ------------------------------------------------
# 1. Atrapa el tráfico HTTP y lo redirige a HTTPS
server {
    listen 80;
    server_name www.clientea.com clientea.com;
    return 301 https://$host$request_uri;
}

# 2. Maneja el tráfico seguro HTTPS
server {
    listen 443 ssl;
    server_name www.clientea.com clientea.com;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://lb-cliente-a:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant clientea;
    }
}

