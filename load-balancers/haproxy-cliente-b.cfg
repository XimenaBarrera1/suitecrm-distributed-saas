global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend cliente_b_frontend
    bind *:80
    default_backend cliente_b_backend

backend cliente_b_backend
    balance roundrobin
    option httpchk GET /
    server suitecrm-b1 suitecrm-b1:80 check
    server suitecrm-b2 suitecrm-b2:80 check
