global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend cliente_a_frontend
    bind *:80
    default_backend cliente_a_backend

backend cliente_a_backend
    balance roundrobin
    option httpchk GET /
    server suitecrm-a1 suitecrm-a1:80 check inter 2s fall 2 rise 2
    server suitecrm-a2 suitecrm-a2:80 check inter 2s fall 2 rise 2
