services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/zones:/etc/bind/zones:ro
    networks:
      external_net:
        ipv4_address: 192.168.0.2
      dmz_net:
        ipv4_address: 192.168.1.2
    restart: unless-stopped

  firewall:
    build:
      context: ./firewall
    container_name: firewall
    privileged: true
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "80:80"
      - "443:443"
    networks:
      external_net:
        ipv4_address: 192.168.0.1
      dmz_net:
        ipv4_address: 192.168.1.1
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.5
    restart: unless-stopped

  lb-cliente-a:
    image: haproxy:2.9-alpine
    container_name: lb-cliente-a
    volumes:
      - ./load-balancers/haproxy-cliente-a.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.6
    restart: unless-stopped
    depends_on:
      - suitecrm-a1
      - suitecrm-a2

  lb-cliente-b:
    image: haproxy:2.9-alpine
    container_name: lb-cliente-b
    volumes:
      - ./load-balancers/haproxy-cliente-b.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.7
    restart: unless-stopped
    depends_on:
      - suitecrm-b1
      - suitecrm-b2

  db-node-1:
    image: mariadb:10.11
    container_name: db-node-1
    hostname: db-node-1
#    command:
 #    - mysqld
  #   - --wsrep-new-cluster
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: suitecrm_clientea
      MARIADB_USER: suitecrm_user
      MARIADB_PASSWORD: suitecrm_pass
    volumes:
      - db_node_1_data:/var/lib/mysql
      - ./database/galera/conf/galera-node1.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./database/galera/init:/docker-entrypoint-initdb.d:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.11
    restart: unless-stopped

  db-node-2:
    image: mariadb:10.11
    container_name: db-node-2
    hostname: db-node-2
    environment:
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - db_node_2_data:/var/lib/mysql
      - ./database/galera/conf/galera-node2.cnf:/etc/mysql/conf.d/galera.cnf:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.12
    restart: unless-stopped
    depends_on:
      - db-node-1

  db-node-3:
    image: mariadb:10.11
    container_name: db-node-3
    hostname: db-node-3
    environment:
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - db_node_3_data:/var/lib/mysql
      - ./database/galera/conf/galera-node3.cnf:/etc/mysql/conf.d/galera.cnf:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.13
    restart: unless-stopped
    depends_on:
      - db-node-1

  db-lb:
    image: haproxy:2.9-alpine
    container_name: db-lb
    volumes:
      - ./database/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.10
    restart: unless-stopped
    depends_on:
      - db-node-1
      - db-node-2
      - db-node-3

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      internal_net:
        ipv4_address: 192.168.2.20
    volumes:
      - redis_data:/data
    restart: unless-stopped

  suitecrm-a1:
    build:
      context: ./apps/suitecrm
    image: suitecrm-app:7.15.1
    container_name: suitecrm-a1
    environment:
      SUITECRM_CLIENT: clientea
      DB_HOST: db-lb
      DB_NAME: suitecrm_clientea
      DB_USER: suitecrm_user
      DB_PASSWORD: suitecrm_pass
      REDIS_HOST: redis
    volumes:
      - suitecrm_clientea_app:/var/www/html
    networks:
      dmz_net:
        ipv4_address: 192.168.1.11
      internal_net:
        ipv4_address: 192.168.2.101
    restart: unless-stopped
    depends_on:
      - db-lb
      - redis

  suitecrm-a2:
    image: suitecrm-app:7.15.1
    container_name: suitecrm-a2
    environment:
      SUITECRM_CLIENT: clientea
      DB_HOST: db-lb
      DB_NAME: suitecrm_clientea
      DB_USER: suitecrm_user
      DB_PASSWORD: suitecrm_pass
      REDIS_HOST: redis
    volumes:
      - suitecrm_clientea_app:/var/www/html
    networks:
      dmz_net:
        ipv4_address: 192.168.1.12
      internal_net:
        ipv4_address: 192.168.2.102
    restart: unless-stopped
    depends_on:
      - db-lb
      - redis

  suitecrm-b1:
    image: suitecrm-app:7.15.1
    container_name: suitecrm-b1
    environment:
      SUITECRM_CLIENT: clienteb
      DB_HOST: db-lb
      DB_NAME: suitecrm_clienteb
      DB_USER: suitecrm_user
      DB_PASSWORD: suitecrm_pass
      REDIS_HOST: redis
    volumes:
      - suitecrm_clienteb_app:/var/www/html
    networks:
      dmz_net:
        ipv4_address: 192.168.1.21
      internal_net:
        ipv4_address: 192.168.2.201
    restart: unless-stopped
    depends_on:
      - db-lb
      - redis

  suitecrm-b2:
    image: suitecrm-app:7.15.1
    container_name: suitecrm-b2
    environment:
      SUITECRM_CLIENT: clienteb
      DB_HOST: db-lb
      DB_NAME: suitecrm_clienteb
      DB_USER: suitecrm_user
      DB_PASSWORD: suitecrm_pass
      REDIS_HOST: redis
    volumes:
      - suitecrm_clienteb_app:/var/www/html
    networks:
      dmz_net:
        ipv4_address: 192.168.1.22
      internal_net:
        ipv4_address: 192.168.2.202
    restart: unless-stopped
    depends_on:
      - db-lb
      - redis

networks:
  dmz_net:
    name: dmz_net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254

  internal_net:
    name: internal_net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.254

  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.254

volumes:
  db_node_1_data:
  db_node_2_data:
  db_node_3_data:
  redis_data:
  suitecrm_clientea_app:
  suitecrm_clienteb_app:
