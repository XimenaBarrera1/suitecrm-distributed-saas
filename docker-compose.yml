services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "${DNS_IP}:53:53/udp"
      - "${DNS_IP}:53:53/tcp"
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/zones:/etc/bind/zones:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.2
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    ports:
      - "${ENTRYPOINT_IP}:80:80/tcp"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.5
    restart: unless-stopped
    depends_on:
      - dns
      
  lb-cliente-a:
    image: haproxy:2.9-alpine
    container_name: lb-cliente-a
    volumes:
      - ./load-balancers/haproxy-cliente-a.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.6
    restart: unless-stopped
    depends_on:
      - suitecrm-a1
      - suitecrm-a2

  lb-cliente-b:
    image: haproxy:2.9-alpine
    container_name: lb-cliente-b
    volumes:
      - ./load-balancers/haproxy-cliente-b.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.7
    restart: unless-stopped
    depends_on:
      - suitecrm-b1
      - suitecrm-b2

  suitecrm-a1:
    image: nginx:1.27-alpine
    container_name: suitecrm-a1
    volumes:
      - ./apps/mock-suitecrm/clientea1:/usr/share/nginx/html:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.11
    restart: unless-stopped

  suitecrm-a2:
    image: nginx:1.27-alpine
    container_name: suitecrm-a2
    volumes:
      - ./apps/mock-suitecrm/clientea2:/usr/share/nginx/html:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.12
    restart: unless-stopped

  suitecrm-b1:
    image: nginx:1.27-alpine
    container_name: suitecrm-b1
    volumes:
      - ./apps/mock-suitecrm/clienteb1:/usr/share/nginx/html:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.21
    restart: unless-stopped

  suitecrm-b2:
    image: nginx:1.27-alpine
    container_name: suitecrm-b2
    volumes:
      - ./apps/mock-suitecrm/clienteb2:/usr/share/nginx/html:ro
    networks:
      dmz_net:
        ipv4_address: 192.168.1.22
    restart: unless-stopped
  db-node-1:
    image: mariadb:10.11
    container_name: db-node-1
    command:
      - --wsrep-new-cluster
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: suitecrm_clientea
      MARIADB_USER: suitecrm_user
      MARIADB_PASSWORD: suitecrm_password
    volumes:
      - db_node_1_data:/var/lib/mysql
      - ./database/galera/conf/galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./database/galera/init:/docker-entrypoint-initdb.d:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.11
    restart: unless-stopped

  db-node-2:
    image: mariadb:10.11
    container_name: db-node-2
    environment:
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - db_node_2_data:/var/lib/mysql
      - ./database/galera/conf/galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.12
    restart: unless-stopped
    depends_on:
      - db-node-1

  db-node-3:
    image: mariadb:10.11
    container_name: db-node-3
    environment:
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - db_node_3_data:/var/lib/mysql
      - ./database/galera/conf/galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.13
    restart: unless-stopped
    depends_on:
      - db-node-1

  db-lb:
    image: haproxy:2.9-alpine
    container_name: db-lb
    volumes:
      - ./database/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      internal_net:
        ipv4_address: 192.168.2.1
    restart: unless-stopped
    depends_on:
      - db-node-1
      - db-node-2
      - db-node-3

networks:
  dmz_net:
    name: dmz_net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254

  internal_net:
    name: internal_net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.254
volumes:
  db_node_1_data:
  db_node_2_data:
  db_node_3_data:
